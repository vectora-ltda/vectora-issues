name: Feature request
description: Propose a capability or improvement for Vectora.
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user need does this proposal address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the desired behavior and an example use case.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable results that define completion.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

name: Documentation
description: Request a documentation correction, addition, or clarification.
title: "[Docs]: "
labels:
  - documentation
  - needs-triage
body:
  - type: input
    id: location
    attributes:
      label: Related page or path
      placeholder: URL or file
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing or incorrect?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed correction

name: Bug report
description: Report incorrect or regressed behavior that can be reproduced.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, keys, passwords, or personal data. Use the private security channel for vulnerabilities.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem and its user impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the minimum steps to reproduce the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Vectora version
      placeholder: v0.1.x or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Include OS, browser, and redacted logs when relevant.

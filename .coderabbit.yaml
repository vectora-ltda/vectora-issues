language: pt-BR

reviews:
  auto_review:
    enabled: true
    drafts: false

issue_enrichment:
  auto_enrich:
    enabled: true
  planning:
    enabled: true
    auto_planning:
      enabled: true
      labels:
        - feature
        - enhancement
        - bug
        - plan-me
        - "!no-plan"
  labeling:
    auto_apply_labels: true
    labeling_instructions:
      - label: bug
        instructions: Issues reporting errors, regressions, crashes, or incorrect behavior.
      - label: enhancement
        instructions: New capabilities and functional improvements.
      - label: ux
        instructions: Accessibility, usability, interface, and user experience.
      - label: documentation
        instructions: Documentation corrections, additions, or clarifications.
